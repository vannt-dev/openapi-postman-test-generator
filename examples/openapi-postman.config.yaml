# All fields are optional. CLI flags take precedence.
baseUrl: https://test-api.example.com
responseTimeMs: 2000
safeMode: true
includeNegative: true
variables:
  tenantId: test-tenant
operationOrder:
  - login
  - createUser
  - getUser
  - updateUser
  - deleteUser
variableMappings:
  - sourceOperationId: createUser
    responseJsonPath: $.data.id
    variable: userId
    targetOperationIds: [getUser, updateUser, deleteUser]
disabledOperations:
  - chargeCreditCard
negativeScenarios:
  - operationId: createUser
    name: email is required
    kind: missing_required
    field: email

# Requests outside the spec: seed data first, clean up last. Kept in safe mode.
setup:
  - name: Seed tenant
    method: POST
    url: /admin/seed
    headers:
      X-Admin-Key: "{{adminKey}}"
    body: { name: test-tenant }
    expectStatus: [201]
    extract: { tenantId: $.id }
teardown:
  - name: Delete tenant
    method: DELETE
    url: /admin/tenants/{{tenantId}}

# Poll background jobs started by these operations (Location header by default).
asyncOperations:
  - operationId: createUserExport
    statusJsonPath: $.status
    successValues: [done]
    failureValues: [failed]
    intervalMs: 1000
    maxAttempts: 30

# Select with --profile staging. Profile variables override shared variables.
profiles:
  staging:
    baseUrl: https://staging-api.example.com
    environmentName: Staging API
    variables:
      tenantId: staging-tenant

# AI planning is optional. CLI-based providers reuse their own authenticated session.
ai:
  provider: codex
  fallback: [claude, antigravity, openai]
  timeoutMs: 120000
  maxOutputBytes: 1048576
  providers:
    codex:
      type: codex
      command: codex
    claude:
      type: claude
      command: claude
    antigravity:
      type: antigravity
      command: agy
    openai:
      type: openai
      model: your-supported-model
      apiKeyEnv: OPENAI_API_KEY
    local-agent:
      type: command
      command: my-agent
      args: [--json-schema, "{schema}"]
      input: stdin
      output: stdout-json
