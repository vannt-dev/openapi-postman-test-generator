swagger: '2.0'
info:
  title: Demo Swagger 2 API
  version: 1.0.0
host: localhost:3000
basePath: /api
schemes: [http]
consumes: [application/json]
produces: [application/json]
securityDefinitions:
  apiKey:
    type: apiKey
    name: X-API-Key
    in: header
security:
  - apiKey: []
paths:
  /users/{userId}:
    get:
      tags: [Users]
      summary: Get user
      parameters:
        - name: userId
          in: path
          required: true
          type: integer
          default: 1
      responses:
        '200':
          description: User
          schema: { $ref: '#/definitions/User' }
definitions:
  User:
    type: object
    required: [id, email]
    properties:
      id: { type: integer }
      email: { type: string, format: email }
